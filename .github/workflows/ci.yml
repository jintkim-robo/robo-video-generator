name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint/test tools
        run: python -m pip install --upgrade pip ruff pytest pillow
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q
